<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Convita &mdash; Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1B5E3B;--gl:#2E7D52;--gd:#0D3D24;--cream:#FAFAF5;--border:#D4E0D8;--ts:#5A6B5E;--red:#D32F2F}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:linear-gradient(135deg,var(--gd) 0%,var(--g) 45%,var(--gl) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;top:-150px;right:-150px;width:520px;height:520px;background:radial-gradient(circle,rgba(200,169,81,.14) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.box{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.26);padding:44px 40px 36px;width:100%;max-width:400px;text-align:center;position:relative;z-index:1}
.logo{width:68px;height:68px;background:linear-gradient(135deg,var(--gd),var(--gl));border-radius:17px;display:inline-flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:20px}
h1{font-family:'Playfair Display',serif;font-size:25px;font-weight:600;color:var(--gd);margin-bottom:6px}
p.sub{font-size:13.5px;color:var(--ts);margin-bottom:26px;line-height:1.5}
input{width:100%;padding:14px 16px;font-size:15px;font-family:inherit;border:1.5px solid var(--border);border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s;text-align:center;letter-spacing:.5px}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(27,94,59,.1)}
input.err{border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
button{width:100%;margin-top:14px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;color:#fff;background:var(--g);border:none;border-radius:12px;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:var(--gd)}
button:active{transform:scale(.985)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:13px;color:var(--red);min-height:19px;font-weight:500}
.foot{margin-top:26px;padding-top:20px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ts)}
.foot strong{font-family:'Playfair Display',serif;color:var(--gd);font-size:13px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">C</div>
  <h1>Reportes de Gesti&oacute;n</h1>
  <p class="sub">Este contenido es privado.<br>Ingres&aacute; la contrase&ntilde;a para continuar.</p>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="Contrase&ntilde;a" autofocus autocomplete="current-password">
    <button type="submit" id="btn">Entrar</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot"><strong>Convita</strong> &middot; Integro SAS<br>Sin gluten, sin complicaciones.</div>
</div>

const ITER = 310000;
const KEY = "convita_pw";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrir(pw) {
  const raw = b64(PAYLOAD);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return new TextDecoder().decode(plano);
}

function pintar(html) {
  document.open();
  document.write(html);
  document.close();
}

async function intentar(pw, silencioso) {
  try {
    const html = await abrir(pw);
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    pintar(html);
    return true;
  } catch (e) {
    if (!silencioso) {
      const i = document.getElementById("pw"), m = document.getElementById("msg");
      i.classList.add("err"); i.value = ""; i.focus();
      m.textContent = "Contrase\u00f1a incorrecta.";
      setTimeout(() => i.classList.remove("err"), 450);
    }
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    return false;
  }
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = document.getElementById("btn");
  b.disabled = true; b.textContent = "Verificando\u2026";
  document.getElementById("msg").textContent = "";
  await intentar(document.getElementById("pw").value, false);
  b.disabled = false; b.textContent = "Entrar";
});

(async () => {
  let guardada = null;
  try { guardada = sessionStorage.getItem(KEY); } catch (e) {}
  if (guardada) await intentar(guardada, true);
})();
</script>
